server {
    listen 80;
    server_name www.wehifun.cn wehifun.cn;
    location /.well-known/acme-challenge/ { root /var/www/wehifun; }
    location / { return 301 https://www.wehifun.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name wehifun.cn;
    ssl_certificate /etc/letsencrypt/live/www.wehifun.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wehifun.cn/privkey.pem;
    return 301 https://www.wehifun.cn$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.wehifun.cn;
    ssl_certificate /etc/letsencrypt/live/www.wehifun.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wehifun.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    location /.well-known/acme-challenge/ { root /var/www/wehifun; }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:1842;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
